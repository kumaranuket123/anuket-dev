<!DOCTYPE html>
<html>

<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">

  <!-- Preconnect to Google Fonts CDN early to reduce latency -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Preload the three font families used by the app so they are cached
       before Flutter boots. Instagram's WebView often blocks runtime font
       fetches; loading them from the HTML head bypasses that restriction. -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700;800&family=Fira+Code:wght@400;500;600;700&display=swap">

  <!-- iOS / PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Anuket Kumar">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <!-- SEO & Social -->
  <title>Anuket Kumar | Flutter Developer</title>
  <meta name="description" content="Senior Flutter Developer building scalable cross-platform apps. Portfolio of Anuket Kumar.">
  <meta property="og:title" content="Anuket Kumar | Flutter Developer">
  <meta property="og:description" content="Senior Flutter Developer building scalable cross-platform mobile and web apps.">
  <meta property="og:image" content="preview.png">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Anuket Kumar | Flutter Developer">
  <meta name="twitter:image" content="preview.png">

  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      height: 100%;
      /* Do NOT use overflow:hidden on html — it breaks scrolling in WebViews */
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background-color: #0B0F19;
    }

    /* Loading screen shown before Flutter boots.
       Contains a static brand/tagline so the page has instant content
       (perceived performance) instead of a blank dark screen. */
    #flutter-loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #0B0F19;
      z-index: 9999;
      transition: opacity 0.3s ease;
      padding: 24px;
      box-sizing: border-box;
    }

    #flutter-loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #flutter-loading .brand {
      font-family: 'Fira Code', ui-monospace, Menlo, monospace;
      font-weight: 700;
      font-size: 22px;
      letter-spacing: 0.5px;
      background: linear-gradient(90deg, #00F2FE, #4FACFE);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 10px;
    }

    #flutter-loading .tagline {
      font-family: 'Fira Code', ui-monospace, Menlo, monospace;
      font-size: 13px;
      color: #8B9BB4;
      margin: 0 0 28px;
    }

    .loading-row {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .loading-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #00F2FE;
      margin: 0 4px;
      animation: bounce 1.2s infinite ease-in-out;
    }

    .loading-dot:nth-child(2) { animation-delay: 0.2s; }
    .loading-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40%            { transform: scale(1.0); opacity: 1.0; }
    }
  </style>
</head>

<body>
  <!-- Static brand shown instantly; hidden once Flutter boots -->
  <div id="flutter-loading">
    <div class="brand">&gt;_ anuket</div>
    <p class="tagline">Flutter&nbsp;Developer</p>
    <div class="loading-row">
      <div class="loading-dot"></div>
      <div class="loading-dot"></div>
      <div class="loading-dot"></div>
    </div>
  </div>

  <script>
    (function () {
      var ua = navigator.userAgent || '';
      var isIAB = /Instagram|FBAN|FBAV|Twitter\/|LinkedInApp|Snapchat|TikTok/i.test(ua);
      if (!isIAB) return;

      var isIOS = /iPhone|iPad|iPod/i.test(ua);
      var instruction = isIOS
        ? 'Tap <strong style="color:#e2e8f0">···</strong> at the bottom-right &rarr; <strong style="color:#e2e8f0">Open in Safari</strong>'
        : 'Tap <strong style="color:#e2e8f0">⋮</strong> at the top-right &rarr; <strong style="color:#e2e8f0">Open in Chrome</strong>';

      document.addEventListener('DOMContentLoaded', function () {
        var o = document.createElement('div');
        o.id = 'iab-wall';
        o.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#0B0F19;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;box-sizing:border-box;font-family:system-ui,sans-serif;text-align:center';
        o.innerHTML =
          '<div style="max-width:320px;width:100%">' +
            '<div style="font-family:monospace;color:#00F2FE;font-size:20px;font-weight:700;margin-bottom:20px">&gt;_ anuket</div>' +
            '<p style="color:#e2e8f0;font-size:15px;line-height:1.65;margin:0 0 10px">This page works best in your device browser.</p>' +
            '<p style="color:#64748b;font-size:14px;line-height:1.65;margin:0 0 28px">' + instruction + '</p>' +
            '<button id="iab-copy" style="background:transparent;border:1.5px solid #00F2FE;color:#00F2FE;padding:13px 0;border-radius:6px;font-family:monospace;font-size:13px;cursor:pointer;width:100%;margin-bottom:10px;letter-spacing:.5px">Copy Link</button>' +
            '<button onclick="document.getElementById(\'iab-wall\').remove()" style="background:transparent;border:1.5px solid #1e293b;color:#475569;padding:13px 0;border-radius:6px;font-family:monospace;font-size:13px;cursor:pointer;width:100%;letter-spacing:.5px">Continue Anyway</button>' +
          '</div>';
        document.body.appendChild(o);
        document.getElementById('iab-copy').addEventListener('click', function () {
          var btn = this;
          navigator.clipboard.writeText(window.location.href).then(function () {
            btn.textContent = 'Copied!';
            setTimeout(function () { btn.textContent = 'Copy Link'; }, 2000);
          }).catch(function () {
            btn.textContent = 'Copy failed';
          });
        });
      });
    }());
  </script>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Remove the loading screen once Flutter signals it is ready.
    window.addEventListener('flutter-first-frame', function () {
      const loader = document.getElementById('flutter-loading');
      if (loader) {
        loader.classList.add('hidden');
        setTimeout(() => loader.remove(), 350);
      }
    });
  </script>
</body>

</html>
